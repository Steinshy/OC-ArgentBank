swagger: '2.0'
info:
  title: Argent Bank API
  description: User endpoints are implemented in `Backend/routes`. Transaction endpoints are the proposed API for phase 2 and are not implemented yet.
  version: '1.0.0'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
tags:
  - name: User Module
    description: Authentication and profile (implemented)
  - name: Transaction Module
    description: Accounts and transactions (proposed, not implemented)
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: 'JWT from /user/login, sent as "Bearer <token>"'
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Log in
      description: Returns a JWT valid for 1 day.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Login'
      responses:
        '200':
          description: User successfully logged in
          schema:
            $ref: '#/definitions/LoginResponse'
        '401':
          description: Invalid email or password
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
  /user/signup:
    post:
      tags:
        - User Module
      summary: Sign up
      description: Creates a user. Does not log in; call /user/login for a token.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/User'
      responses:
        '200':
          description: User successfully created
          schema:
            $ref: '#/definitions/UserProfileResponse'
        '400':
          description: Email, password, first name and last name are required
          schema:
            $ref: '#/definitions/ErrorResponse'
        '409':
          description: Email already exists
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
  /user/profile:
    post:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: Get profile
      description: Returns the profile of the authenticated user.
      responses:
        '200':
          description: Successfully got user profile data
          schema:
            $ref: '#/definitions/UserProfileResponse'
        '401':
          description: Token missing, invalid or expired
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: User not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: Update profile
      description: Updates the first and last name of the authenticated user.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/UserProfileUpdate'
      responses:
        '200':
          description: Successfully updated user profile data
          schema:
            $ref: '#/definitions/UserProfileResponse'
        '401':
          description: Token missing, invalid or expired
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: User not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
  /user/accounts:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: List accounts
      description: Returns all bank accounts of the authenticated user.
      responses:
        '200':
          description: Accounts retrieved successfully
          schema:
            type: array
            items:
              $ref: '#/definitions/Account'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
  /user/accounts/{accountId}/transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: List account transactions
      description: Returns a page of transactions for one account.
      parameters:
        - $ref: '#/parameters/accountId'
        - in: query
          name: page
          description: Page number (1-based)
          type: integer
          default: 1
          minimum: 1
        - in: query
          name: limit
          description: Transactions per page
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Transactions retrieved successfully
          schema:
            $ref: '#/definitions/TransactionPage'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Account not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
  /user/accounts/{accountId}/transactions/{transactionId}:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Get a transaction
      description: Returns the details of one transaction.
      parameters:
        - $ref: '#/parameters/accountId'
        - $ref: '#/parameters/transactionId'
      responses:
        '200':
          description: Transaction retrieved successfully
          schema:
            $ref: '#/definitions/Transaction'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Transaction not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
    patch:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Update a transaction
      description: Updates the editable fields (category, notes) of one transaction.
      parameters:
        - $ref: '#/parameters/accountId'
        - $ref: '#/parameters/transactionId'
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/TransactionUpdate'
      responses:
        '200':
          description: Transaction updated successfully
          schema:
            $ref: '#/definitions/Transaction'
        '400':
          description: Invalid fields
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Transaction not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
parameters:
  accountId:
    in: path
    name: accountId
    description: Account ID
    required: true
    type: string
  transactionId:
    in: path
    name: transactionId
    description: Transaction ID
    required: true
    type: string
definitions:
  User:
    type: object
    required:
      - email
      - password
      - firstName
      - lastName
    properties:
      email:
        type: string
        format: email
      password:
        type: string
        format: password
      firstName:
        type: string
      lastName:
        type: string
  Login:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
      password:
        type: string
        format: password
  LoginResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: User successfully logged in
      body:
        type: object
        properties:
          token:
            type: string
  UserProfileUpdate:
    type: object
    required:
      - firstName
      - lastName
    properties:
      firstName:
        type: string
      lastName:
        type: string
  UserProfile:
    type: object
    properties:
      id:
        type: string
      email:
        type: string
        format: email
      firstName:
        type: string
      lastName:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  UserProfileResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
      body:
        $ref: '#/definitions/UserProfile'
  ErrorResponse:
    type: object
    properties:
      status:
        type: integer
        example: 401
      message:
        type: string
        example: Invalid email or password
  Account:
    type: object
    properties:
      id:
        type: string
      title:
        type: string
        description: Account name and last digits
      amount:
        type: number
        format: double
        description: Current balance
      description:
        type: string
        description: Balance type
  Transaction:
    type: object
    properties:
      id:
        type: string
      date:
        type: string
        format: date
      description:
        type: string
        description: Merchant or transaction description
      amount:
        type: number
        format: double
        description: Negative for debit, positive for credit
      balance:
        type: number
        format: double
        description: Account balance after the transaction
      type:
        type: string
        enum:
          - debit
          - credit
      category:
        type: string
        description: Food, Shopping, Transportation, etc.
      notes:
        type: string
  TransactionUpdate:
    type: object
    properties:
      category:
        type: string
      notes:
        type: string
  TransactionPage:
    type: object
    properties:
      page:
        type: integer
      limit:
        type: integer
      total:
        type: integer
        description: Total number of transactions
      transactions:
        type: array
        items:
          $ref: '#/definitions/Transaction'
