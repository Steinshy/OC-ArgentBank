services:
  mongo:
    image: docker.io/library/mongo:6
    container_name: argentbank-mongo
    restart: unless-stopped
    # Loopback only: the dev database has no authentication.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
